openapi: 3.1.0
info:
  title: MediMove API
  version: 1.0.0
  description: |-
    Backend API for the MediMove medical-transport and ambulance-coordination platform.

    **Authentication** — call `/auth/login` (or `/auth/verify-email`) to get an
    `accessToken` (short-lived) and a `refreshToken`. Send the access token as
    `Authorization: Bearer <accessToken>`. On `401`, rotate with `/auth/refresh`
    and retry once.

    **Errors** — every error is `{ success: false, message, code? }`. Out-of-scope
    single records return `404` (never `403`) so existence is not leaked.

    **Pagination** — list endpoints accept `page`/`limit` and return a
    `pagination` block.

    **Money** — all amounts are integer **kobo** (1 NGN = 100 kobo) and are always
    computed server-side.

    **Rate limits** — auth, login, OTP and geocode routes are rate-limited.

    **Note:** the example schemas are representative; the API may return
    additional fields. See `docs/API.md` for the human-readable reference.
servers:
  - url: /api
    description: Current host (path prefix)
  - url: http://localhost:5000/api
    description: Local development
tags:
  - name: Auth
    description: Registration, login, sessions and passwords
  - name: Profile
    description: Patient profile, emergency contacts, consent and medical info
  - name: Locations
    description: Saved locations, coverage and geocoding
  - name: Bookings
    description: Emergency booking lifecycle and dispatch
  - name: Dispatch
    description: Crew offers and dispatcher operations
  - name: Trips
    description: Crew trip operations and GPS tracking
  - name: Hospitals
    description: Hospital directory and self-maintained operations
  - name: Quality
    description: Trip history, feedback and complaints
  - name: Pricing
    description: Fare estimates and pricing rules
  - name: Payments
    description: Payments, wallet and receipts
  - name: Notifications
    description: Notification feed and outbox management
  - name: Providers
    description: Provider, fleet and crew management
  - name: Admin
    description: Administration, verification and audit
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Short-lived access token from `/auth/login` or `/auth/verify-email`. Send as `Authorization: Bearer <token>`. On 401, rotate via `/auth/refresh` and retry once."
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size (clamped).
    BookingId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Booking id.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource id.
  schemas:
    Error:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Human-readable message
        code:
          type: string
          example: VALIDATION_ERROR
        field:
          type: string
          nullable: true
        details:
          nullable: true
      additionalProperties: true
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - PATIENT
            - CREW
            - DISPATCHER
            - HOSPITAL_STAFF
            - PROVIDER_ADMIN
            - PLATFORM_ADMIN
            - STATE_ADMIN
        stateId:
          type: string
          nullable: true
        hospitalId:
          type: string
          nullable: true
        providerId:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        walletBalanceKobo:
          type: integer
          description: Wallet balance in kobo (1 NGN = 100 kobo).
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/PublicUser"
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 15m
        refreshTokenExpiresAt:
          type: string
          format: date-time
    RefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 15m
        refreshTokenExpiresAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - phone
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password
        fullName:
          type: string
        phone:
          type: string
          example: "+2348012345678"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    VerifyEmailRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          example: "123456"
          description: 6-digit code from the email.
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - email
        - code
        - newPassword
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        newPassword:
          type: string
          minLength: 8
          format: password
    BookingCreateRequest:
      type: object
      required:
        - pickupAddress
        - pickupLat
        - pickupLng
        - destAddress
        - destLat
        - destLng
        - callbackPhone
        - emergencyCategory
      properties:
        pickupAddress:
          type: string
        pickupLat:
          type: number
          example: 7.715
        pickupLng:
          type: number
          example: 5.2515
        landmark:
          type: string
          nullable: true
        destAddress:
          type: string
        destLat:
          type: number
        destLng:
          type: number
        destinationHospitalId:
          type: string
          nullable: true
        providerId:
          type: string
          nullable: true
          description: Preferred provider; resolved server-side when omitted.
        isForSelf:
          type: boolean
          default: true
        patientName:
          type: string
          nullable: true
          description: Required when isForSelf is false.
        patientPhone:
          type: string
          nullable: true
          description: Required when isForSelf is false.
        patientAge:
          type: integer
          nullable: true
        patientGender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
          nullable: true
        callbackPhone:
          type: string
        emergencyCategory:
          type: string
          enum:
            - MEDICAL
            - TRAUMA
            - CARDIAC
            - RESPIRATORY
            - OBSTETRIC
            - PEDIATRIC
            - PSYCHIATRIC
            - ACCIDENT
            - OTHER
        notes:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
          description: Unique per requester; makes a retried create return the original booking.
      additionalProperties: false
    BookingStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - REQUESTED
            - OFFERED
            - ACCEPTED
            - EN_ROUTE
            - ARRIVED
            - PATIENT_ON_BOARD
            - AT_HOSPITAL
            - COMPLETED
            - CANCELLED
            - FAILED
        reason:
          type: string
          nullable: true
          description: Required for FAILED, and for an operator cancelling an in-progress trip.
        crewProfileId:
          type: string
          nullable: true
          description: Operator recording acceptance for an eligible crew.
    DispatchAssignRequest:
      type: object
      required:
        - crewProfileId
      properties:
        crewProfileId:
          type: string
        ambulanceId:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
    TripStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - EN_ROUTE
            - ARRIVED
            - PATIENT_ON_BOARD
            - AT_HOSPITAL
            - COMPLETED
        reason:
          type: string
          nullable: true
    TripLocationRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          nullable: true
        speedKph:
          type: number
          nullable: true
        headingDeg:
          type: number
          nullable: true
        source:
          type: string
          enum:
            - GPS
            - MAP_PIN
          nullable: true
          default: GPS
    ReasonRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
    OptionalReasonRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    PaymentInitializeRequest:
      type: object
      required:
        - type
        - method
      properties:
        type:
          type: string
          enum:
            - BOOKING
            - WALLET_FUNDING
            - SAVINGS
        method:
          type: string
          enum:
            - CARD
            - BANK_TRANSFER
            - WALLET
            - CASH
        amountKobo:
          type: integer
          description: Required for WALLET_FUNDING / SAVINGS.
        bookingId:
          type: string
          nullable: true
        savingsGoalId:
          type: string
          nullable: true
    PaymentVerifyRequest:
      type: object
      required:
        - transactionRef
      properties:
        transactionRef:
          type: string
    RefundRequest:
      type: object
      properties:
        amountKobo:
          type: integer
          nullable: true
          description: Defaults to the full settled amount.
        reason:
          type: string
          nullable: true
    CashPaymentRequest:
      type: object
      required:
        - bookingId
        - amountKobo
      properties:
        bookingId:
          type: string
        amountKobo:
          type: integer
    LocationCreateRequest:
      type: object
      required:
        - source
      properties:
        label:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - GPS
            - MAP_PIN
            - MANUAL
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        accuracyMeters:
          type: number
          nullable: true
        address:
          type: string
          nullable: true
        landmark:
          type: string
          nullable: true
          description: Required when source is MANUAL.
    EstimateRequest:
      type: object
      required:
        - pickupLat
        - pickupLng
        - destLat
        - destLng
      properties:
        pickupLat:
          type: number
        pickupLng:
          type: number
        destLat:
          type: number
        destLng:
          type: number
        vehicleCategory:
          type: string
          enum:
            - BASIC_LIFE_SUPPORT
            - ADVANCED_LIFE_SUPPORT
            - NEONATAL
            - PATIENT_TRANSPORT
        destinationHospitalId:
          type: string
          nullable: true
    FeedbackRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
    ComplaintCreateRequest:
      type: object
      required:
        - category
        - subject
        - description
      properties:
        category:
          type: string
          enum:
            - SERVICE_QUALITY
            - STAFF_CONDUCT
            - BILLING
            - DELAY
            - SAFETY
            - OTHER
        subject:
          type: string
        description:
          type: string
        bookingId:
          type: string
          nullable: true
    ComplaintStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OPEN
            - IN_REVIEW
            - RESOLVED
            - REJECTED
            - CLOSED
        note:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
    SuspendRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    CrewInviteRequest:
      type: object
      required:
        - email
        - crewRole
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        crewRole:
          type: string
          enum:
            - DRIVER
            - PARAMEDIC
            - EMT
            - NURSE
            - DOCTOR
            - ASSISTANT
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: MM-BOOK-AB12CD34
        status:
          type: string
          enum:
            - REQUESTED
            - OFFERED
            - ACCEPTED
            - EN_ROUTE
            - ARRIVED
            - PATIENT_ON_BOARD
            - AT_HOSPITAL
            - COMPLETED
            - CANCELLED
            - FAILED
        isDispatched:
          type: boolean
          description: True only once a verified, active crew has accepted.
        emergencyCategory:
          type: string
        pickupAddress:
          type: string
        pickupLat:
          type: number
        pickupLng:
          type: number
        destAddress:
          type: string
        destLat:
          type: number
        destLng:
          type: number
        distanceKm:
          type: number
        estimatedFare:
          type: integer
          description: Server-computed fare in kobo.
        fareBreakdown:
          type: object
          nullable: true
        providerId:
          type: string
        stateId:
          type: string
          nullable: true
        assignedAmbulanceId:
          type: string
          nullable: true
        acceptedById:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    DispatchOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
        providerId:
          type: string
        ambulanceId:
          type: string
        crewProfileId:
          type: string
        round:
          type: integer
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - EXPIRED
            - CANCELLED
        capabilityMatch:
          type: boolean
        distanceKm:
          type: number
          nullable: true
        expiresAt:
          type: string
          format: date-time
      additionalProperties: true
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionRef:
          type: string
        amountKobo:
          type: integer
        currency:
          type: string
          example: NGN
        status:
          type: string
          enum:
            - PENDING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
        type:
          type: string
        method:
          type: string
          enum:
            - CARD
            - BANK_TRANSFER
            - WALLET
            - CASH
            - OTHER
        bookingId:
          type: string
          nullable: true
        receiptNumber:
          type: string
          nullable: true
        refundStatus:
          type: string
          enum:
            - NONE
            - PENDING
            - REFUNDED
            - FAILED
        verifiedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    Tracking:
      type: object
      properties:
        bookingId:
          type: string
        status:
          type: string
        isLive:
          type: boolean
        staleAfterSeconds:
          type: integer
        lastKnownSource:
          type: string
          nullable: true
        location:
          type: object
          nullable: true
          properties:
            latitude:
              type: number
            longitude:
              type: number
            recordedAt:
              type: string
              format: date-time
            ageSeconds:
              type: integer
            isLive:
              type: boolean
        nextWaypoint:
          type: string
          nullable: true
        distanceRemainingKm:
          type: number
          nullable: true
        etaMinutes:
          type: number
          nullable: true
        etaAt:
          type: string
          format: date-time
          nullable: true
        recentLocations:
          type: array
          items:
            type: object
    Hospital:
      type: object
      properties:
        id:
          type: string
          example: hosp-1
        name:
          type: string
        city:
          type: string
        stateId:
          type: string
        lat:
          type: number
        lng:
          type: number
        category:
          type: string
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
        acceptsEmergencies:
          type: boolean
      additionalProperties: true
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
            - EMAIL
            - SMS
            - PUSH
            - WHATSAPP
        eventType:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - SENT
            - FAILED
            - CANCELLED
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted (role/permission/scope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found, or out of the caller's data scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Create account + send verification OTP
      operationId: postauth_register
      security: []
      requestBody:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: &a1
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                additionalProperties: true
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: Verify OTP → token pair
      operationId: postauth_verify_email
      security: []
      requestBody:
        application/json:
          schema:
            $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Resend verification OTP
      operationId: postauth_resend_verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: JSON request body. See the endpoint summary and docs/API.md for fields.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a1
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Email + password login
      operationId: postauth_login
      security: []
      requestBody:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token → new token pair
      operationId: postauth_refresh
      security: []
      requestBody:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke current session
      operationId: postauth_logout
      security: []
      requestBody:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a1
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/logout-all:
    post:
      tags:
        - Auth
      summary: Revoke all sessions
      operationId: postauth_logout_all
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: JSON request body. See the endpoint summary and docs/API.md for fields.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Authenticated profile
      operationId: getauth_me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/sessions:
    get:
      tags:
        - Auth
      summary: List active sessions/devices
      operationId: getauth_sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/sessions/{id}:
    delete:
      tags:
        - Auth
      summary: Revoke a specific session
      operationId: deleteauth_sessions_id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: id path parameter.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/password/change:
    post:
      tags:
        - Auth
      summary: Change password (verifies current)
      operationId: postauth_password_change
      security:
