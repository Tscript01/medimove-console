<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#145B63" />
    <title>MediMove Console</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f7f8; font-family: Manrope, system-ui, sans-serif; color: #172b3a; }
      body { display: grid; place-items: center; }
      .boot { text-align: center; }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #145b63; color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; margin: 0 auto 16px; }
      p { color: #64748b; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="mark" aria-hidden="true">M</div>
      <p>Loading MediMove Console…</p>
    </div>
  </body>
</html>
